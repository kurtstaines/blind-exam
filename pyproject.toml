[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blind-exam"
version = "0.1.0"
description = "Sit any LLM on a blind, resumable exam: one fresh call per item, a hidden answer key, calibrated scoring and a leaderboard."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kurtlon Earl Sta. Ines" }]
dependencies = ["pillow>=10"]
keywords = ["llm", "evaluation", "evals", "benchmark", "leaderboard", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/kurtstaines/blind-exam"
Issues = "https://github.com/kurtstaines/blind-exam/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
blind-exam = "blind_exam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
